<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>PDF Unlock Tool</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:16px;
 max-width:750px;
 margin:auto;
 font-family:Arial,sans-serif;
 background:#f5f3ff;
 color:#252238;
}

header{
 background:linear-gradient(135deg,#6d28d9,#a855f7);
 color:white;
 padding:23px;
 border-radius:16px;
}

h1{font-size:23px;margin:0 0 7px}

.panel{
 background:white;
 padding:18px;
 margin-top:16px;
 border-radius:15px;
 box-shadow:0 3px 15px #0000000d;
}

label{
 display:block;
 font-weight:bold;
 margin:13px 0 8px;
}

input{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:15px;
}

button{
 width:100%;
 padding:14px;
 margin-top:14px;
 background:#6d28d9;
 color:white;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{opacity:.5}

.secondary{
 background:#ede9fe;
 color:#5b21b6;
}

.filebox{
 border:1px dashed #a78bfa;
 padding:16px;
 border-radius:12px;
 background:#faf8ff;
}

#status{
 margin-top:14px;
 font-size:14px;
 line-height:1.6;
}

.progress{
 height:9px;
 background:#eee;
 border-radius:20px;
 margin-top:12px;
 overflow:hidden;
}

#bar{
 height:100%;
 width:0%;
 background:#7c3aed;
 transition:width .2s;
}

#results{display:none}

.result{
 border:1px solid #e5ddf5;
 padding:13px;
 border-radius:10px;
 margin:10px 0;
 overflow-wrap:anywhere;
}

.success{color:#15803d;font-weight:bold}
.failed{color:#dc2626;font-weight:bold}

.download{
 background:#16a34a;
 padding:10px;
 font-size:14px;
}

.small{
 color:#777;
 font-size:12px;
 line-height:1.5;
}

#zipButton{display:none;background:#15803d}

</style>
</head>

<body>

<header>
<h1>PDF UNLOCK TOOL</h1>
<div>Mobile & PC | Single & Multiple PDF</div>
</header>

<div class="panel">

<div class="filebox">

<label>Select PDF Files</label>

<input
 type="file"
 id="files"
 accept=".pdf,application/pdf"
 multiple
>

<p class="small">
Ek PDF ya ek saath multiple PDF select kar sakte hain.
</p>

<div id="fileInfo" class="small"></div>

</div>

<label>Enter PDF Password</label>

<input
 type="password"
 id="password"
 placeholder="PDF password enter karein"
 autocomplete="off"
>

<button id="unlockBtn">
UNLOCK PDF
</button>

<div class="progress">
<div id="bar"></div>
</div>

<div id="status">
PDF select karke password enter karein.
</div>

</div>

<div class="panel" id="results">

<h3>Unlock Results</h3>

<div id="summary"></div>

<button id="zipButton">
DOWNLOAD ALL PDF (ZIP)
</button>

<div id="entries"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script type="module">

import { createPdfToolkit } from
"https://esm.sh/pdfstudio@0.4.0";

const $ = id => document.getElementById(id);

let toolkit = null;
let unlockedFiles = [];
let processing = false;


/* FILE SELECTION */

$("files").addEventListener("change",()=>{

 const files = [...$("files").files];

 $("fileInfo").textContent = files.length
  ? files.length+" PDF selected"
  : "No PDF selected";

});


/* DOWNLOAD FUNCTION */

function downloadBlob(blob,name){

 const url = URL.createObjectURL(blob);

 const a = document.createElement("a");

 a.href = url;
 a.download = name;

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),60000);

}


/* SAFE FILE NAME */

function safeName(name){

 return name.replace(/[\\/:*?"<>|]/g,"_");

}


/* MAIN UNLOCK */

$("unlockBtn").addEventListener("click",async()=>{

 if(processing) return;

 const files = [...$("files").files];
 const password = $("password").value;

 $("results").style.display="none";
 $("entries").innerHTML="";
 $("bar").style.width="0%";
 unlockedFiles=[];
 $("zipButton").style.display="none";

 if(!files.length){

  $("status").textContent="Please select PDF first.";
  return;

 }

 if(!password){

  $("status").textContent="Please enter PDF password.";
  return;

 }

 if(!window.JSZip){

  $("status").textContent="ZIP library load nahi hui. Internet check karein.";
  return;

 }

 processing=true;
 $("unlockBtn").disabled=true;

 try{

  $("status").textContent="Loading PDF Unlock Engine...";

  if(!toolkit){

   toolkit = await createPdfToolkit();

  }

  let success=0;
  let failed=0;

  const zip = new JSZip();

  const usedNames = new Set();

  const report = [];

  for(let i=0;i<files.length;i++){

   const file=files[i];

   $("status").textContent=
    `Processing ${i+1} / ${files.length}: ${file.name}`;

   try{

    const output=await toolkit.unlock(file,{
     password:password
    });

    if(!output || !output.length){
     throw new Error("Empty output PDF");
    }

    const baseName=safeName(
     file.name.replace(/\.pdf$/i,"")
    );

    let outputName=baseName+"_unlocked.pdf";

    let counter=2;

    while(usedNames.has(outputName.toLowerCase())){

     outputName=baseName+"_unlocked_"+counter+".pdf";
     counter++;

    }

    usedNames.add(outputName.toLowerCase());

    const blob=new Blob([output],{
     type:"application/pdf"
    });

    unlockedFiles.push({

     name:outputName,
     blob:blob

    });

    zip.file(outputName,output);

    report.push("SUCCESS: "+file.name+" -> "+outputName);

    success++;

    $("entries").innerHTML+=`

     <div class="result">

      <div class="success">✓ UNLOCKED</div>

      <div>${escapeHtml(file.name)}</div>

      <div class="small">${escapeHtml(outputName)}</div>

      <button class="download"
       data-download="${unlockedFiles.length-1}">
       DOWNLOAD PDF
      </button>

     </div>

    `;

   }catch(error){

    failed++;

    const message=String(
     error.name+" "+error.message
    ).toLowerCase();

    let reason="PDF unlock nahi ho payi.";

    if(
     message.includes("password") ||
     message.includes("decrypt") ||
     message.includes("invalid")
    ){

     reason="Wrong password ya password verification failed.";

    }else if(
     message.includes("encrypt")
    ){

     reason="Unsupported PDF encryption.";

    }else if(
     message.includes("invalid pdf") ||
     message.includes("corrupt")
    ){

     reason="PDF damaged ya invalid hai.";

    }

    report.push("FAILED: "+file.name+" - "+reason);

    $("entries").innerHTML+=`

     <div class="result">

      <div class="failed">✕ FAILED</div>

      <div>${escapeHtml(file.name)}</div>

      <div class="small">${escapeHtml(reason)}</div>

     </div>

    `;

   }

   $("bar").style.width=
    Math.round(((i+1)/files.length)*100)+"%";

  }


  /* ADD REPORT TO ZIP */

  if(success>0 && files.length>1){

   zip.file("Unlock_Report.txt",report.join("\n"));

   $("status").textContent=
    "Creating ZIP file... Please wait.";

   const zipBlob=await zip.generateAsync({

    type:"blob",
    compression:"DEFLATE",
    compressionOptions:{level:4}

   },metadata=>{

    $("status").textContent=
     "Creating ZIP: "+Math.round(metadata.percent)+"%";

   });

   $("zipButton").style.display="block";

   $("zipButton").onclick=()=>{

    downloadBlob(zipBlob,"Unlocked_PDFs.zip");

   };

   /* AUTOMATIC ZIP DOWNLOAD */

   downloadBlob(zipBlob,"Unlocked_PDFs.zip");

  }

  /* SINGLE PDF AUTO DOWNLOAD */

  if(success===1 && files.length===1){

   downloadBlob(
    unlockedFiles[0].blob,
    unlockedFiles[0].name
   );

  }


  $("summary").innerHTML=`

   <p><b>Total PDFs:</b> ${files.length}</p>
   <p class="success">Successfully Unlocked: ${success}</p>
   <p class="failed">Failed: ${failed}</p>

  `;

  $("results").style.display="block";

  $("status").textContent=
   "Checking Complete! "+success+" PDF unlocked, "+failed+" failed.";

 }catch(error){

  $("status").textContent=
   "Error: "+error.message;

 }finally{

  processing=false;
  $("unlockBtn").disabled=false;

 }

});


/* INDIVIDUAL DOWNLOAD BUTTONS */

$("entries").addEventListener("click",e=>{

 const btn=e.target.closest("[data-download]");

 if(!btn) return;

 const index=Number(btn.dataset.download);

 const item=unlockedFiles[index];

 if(item){

  downloadBlob(item.blob,item.name);

 }

});


/* ZIP DOWNLOAD BUTTON */

$("zipButton").addEventListener("click",()=>{

});


/* HTML ESCAPE */

function escapeHtml(text){

 return String(text).replace(/[&<>"']/g,c=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"

 }[c]));

}

</script>

</body>
</html>
